<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 · 推廣派貨 Portal</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brandline">
      <div class="mark">P</div>
      <h1>推廣派貨 Portal</h1>
    </div>
    <p class="sub">輸入密碼開始。管理員可進入後台設定每月店舖佔比。</p>

    {% if error %}
      <div class="alert error"><span class="tag">錯誤</span><span>{{ error }}</span></div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">
        <span>你的名字（記錄用，可留空）</span>
        <input class="input" type="text" name="name" placeholder="例：Ricky" autocomplete="off">
      </label>
      <label class="field">
        <span>密碼</span>
        <input class="input" type="password" name="password" autofocus required>
      </label>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center;padding:9px">
        登入
      </button>
    </form>
  </div>
</div>
</body>
</html>
